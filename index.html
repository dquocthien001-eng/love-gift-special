<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#190b22"><title>Một món quà dành cho em 💗</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
:root{--pink:#ff91ba;--cream:#fff1e9;--bg:#190b22}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 20%,#57274d 0%,#27112f 48%,#13091d 100%);color:var(--cream);font-family:'DM Sans',sans-serif;overflow-x:hidden}.stars,.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 3s infinite alternate}.heart{position:absolute;bottom:-40px;opacity:0;animation:floatUp var(--duration) linear infinite;animation-delay:var(--delay);font-size:var(--size)}@keyframes twinkle{to{opacity:.15;transform:scale(.5)}}@keyframes floatUp{10%{opacity:.65}85%{opacity:.5}100%{transform:translate3d(var(--drift),-115vh,0) rotate(28deg);opacity:0}}main{position:relative;z-index:2;min-height:100svh;display:grid;place-items:center;padding:36px 18px}.scene{width:min(100%,520px);text-align:center;animation:appear 1s ease both}.eyebrow{letter-spacing:.28em;text-transform:uppercase;font-size:11px;color:#ffd4e5;font-weight:700}.title{font:600 clamp(37px,9vw,62px)/1.12 'Playfair Display',serif;margin:18px 0 12px;text-shadow:0 8px 40px #f8619c40}.title em{color:#ff9fc6;font-style:normal}.subtitle{font-size:14px;line-height:1.8;color:#f3d7e5;max-width:370px;margin:0 auto 26px}.gift-wrap{height:250px;display:grid;place-items:center;perspective:900px}.gift{position:relative;width:170px;height:150px;cursor:pointer;filter:drop-shadow(0 24px 30px #0007);animation:bob 3.5s ease-in-out infinite;transition:transform .25s}.gift:hover{transform:scale(1.07)}.gift-box{position:absolute;bottom:0;width:170px;height:116px;border-radius:9px 9px 18px 18px;background:linear-gradient(135deg,#ffb0cb,#ef5b96 75%);box-shadow:inset -12px -12px 20px #ba2c6940}.gift-lid{position:absolute;top:20px;left:-10px;width:190px;height:42px;border-radius:9px;background:linear-gradient(145deg,#ffc8dd,#f579a9);z-index:3;box-shadow:0 5px 10px #0003}.ribbon-v{position:absolute;left:72px;top:20px;height:130px;width:27px;background:linear-gradient(90deg,#fff4c8,#eacb79,#fff2c1);z-index:4}.ribbon-h{position:absolute;top:66px;width:170px;height:25px;background:#ffe9a5;z-index:2}.bow{position:absolute;top:-20px;left:59px;font-size:57px;z-index:5;line-height:1;filter:drop-shadow(0 2px 3px #0003)}@keyframes bob{50%{translate:0 -10px}}@keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}button{border:0;cursor:pointer;font-family:inherit}.cta{background:linear-gradient(135deg,#ffb4d1,#ff6da7);color:#43142e;font-weight:700;padding:15px 28px;border-radius:99px;box-shadow:0 8px 35px #ff6da74d;font-size:14px;transition:transform .2s}.cta:hover{transform:translateY(-3px)}.hint{margin-top:17px;color:#d9b2c7;font-size:12px}.hidden{display:none!important}.letter{position:relative;background:linear-gradient(155deg,#fff8f2,#ffe5eb);color:#60334b;padding:35px 27px;border-radius:20px;box-shadow:0 24px 80px #0007;text-align:center;animation:appear .7s ease both}.letter:before{content:'♡';display:block;color:#ed78a4;font-size:39px}.letter h2{font:600 34px 'Playfair Display',serif;margin:6px 0 15px;color:#aa416f}.letter p{line-height:1.95;font-size:15px;white-space:pre-line}.signature{font:italic 21px 'Playfair Display',serif;color:#bc5683;margin:23px 0}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}.secondary{border:1px solid #d89eb7;color:#8b4567;background:transparent;border-radius:99px;padding:12px 18px;font-weight:600}.small{font-size:12px;color:#a17a8b;margin-top:22px}.settings{position:fixed;z-index:10;top:16px;right:16px;border:1px solid #ffffff35;border-radius:99px;background:#ffffff15;color:white;padding:10px 14px;backdrop-filter:blur(12px)}dialog{border:1px solid #f5c2d8;border-radius:20px;padding:24px;width:min(92vw,430px);background:#fff8f7;color:#55263d;box-shadow:0 20px 80px #0008}dialog::backdrop{background:#110615b8}dialog h3{margin:0 0 15px;font:600 26px 'Playfair Display',serif}label{display:block;text-align:left;font-size:13px;margin:13px 0 5px}input,textarea{width:100%;padding:12px;border:1px solid #e5b9ca;border-radius:10px;font:inherit;background:white;color:#55263d}textarea{min-height:115px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.confetti{position:fixed;z-index:8;pointer-events:none;animation:burst 1.7s ease-out forwards}@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(720deg);opacity:0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><div class="stars" id="stars"></div><div class="hearts" id="hearts"></div><button class="settings" id="settingsBtn" aria-label="Tùy chỉnh món quà">⚙ Tùy chỉnh</button><main><section class="scene" id="intro"><div class="eyebrow">A LITTLE SURPRISE FOR YOU</div><h1 class="title">Có một điều<br/><em>dành riêng cho em</em> 💗</h1><p class="subtitle">Giữa hàng triệu điều đẹp đẽ trên thế giới này, anh muốn dành tặng em một điều thật đặc biệt.</p><div class="gift-wrap"><div class="gift" id="gift" role="button" tabindex="0" aria-label="Mở hộp quà"><div class="gift-box"></div><div class="ribbon-h"></div><div class="gift-lid"></div><div class="ribbon-v"></div><div class="bow">🎀</div></div></div><button class="cta" id="openBtn">Mở món quà của em ✨</button><p class="hint">Chạm vào hộp quà để khám phá bất ngờ</p></section><section class="scene hidden" id="reveal"><div class="eyebrow" style="margin-bottom:20px">FROM MY HEART TO YOURS</div><article class="letter"><h2 id="recipientHeading">Gửi em yêu 💕</h2><p id="message"></p><div class="signature" id="signature"></div><div class="actions"><button class="secondary" id="againBtn">↻ Xem lại</button><button class="secondary" id="shareBtn">♡ Sao chép link</button></div><div class="small">Made with love ✨</div></article></section></main><dialog id="editor"><h3>Cá nhân hóa món quà 💌</h3><label for="to">Tên người nhận</label><input id="to" maxlength="45" placeholder="Ví dụ: Bé yêu"/><label for="from">Tên người gửi</label><input id="from" maxlength="45" placeholder="Ví dụ: Anh"/><label for="note">Lời nhắn</label><textarea id="note" maxlength="1200"></textarea><div class="dialog-actions"><button class="secondary" id="cancelBtn">Đóng</button><button class="cta" id="saveBtn">Lưu thay đổi</button></div></dialog><script>
const defaults={to:'Em yêu',from:'Người luôn thương em',note:'Cảm ơn em vì đã xuất hiện và khiến những ngày bình thường trở nên đặc biệt.\n\nAnh không hứa mọi ngày đều hoàn hảo, nhưng anh mong mình sẽ luôn có thật nhiều lý do để mỉm cười cùng nhau.\n\nMong em luôn vui vẻ, được yêu thương và mãi là chính mình. 💗'};
const $=id=>document.getElementById(id);let data={...defaults};try{const params=new URLSearchParams(location.search);const packed=params.get('gift');if(packed){const decoded=JSON.parse(decodeURIComponent(escape(atob(packed.replace(/-/g,'+').replace(/_/g,'/')))));for(const key of ['to','from','note'])if(typeof decoded[key]==='string')data[key]=decoded[key].slice(0,key==='note'?1200:45)}}catch(e){};
function render(){ $('recipientHeading').textContent='Gửi '+data.to+' 💕';$('message').textContent=data.note;$('signature').textContent='— '+data.from+' ♡';$('to').value=data.to;$('from').value=data.from;$('note').value=data.note}render();
const stars=$('stars'),hearts=$('hearts');for(let i=0;i<75;i++){const s=document.createElement('span');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';stars.append(s)}for(let i=0;i<19;i++){const h=document.createElement('span');h.className='heart';h.textContent=['♡','♥','✦'][i%3];h.style.left=Math.random()*100+'%';h.style.color=i%3===2?'#ffe1b8':'#ff92ba';h.style.setProperty('--duration',9+Math.random()*13+'s');h.style.setProperty('--delay',-Math.random()*20+'s');h.style.setProperty('--size',12+Math.random()*20+'px');h.style.setProperty('--drift',(Math.random()-.5)*170+'px');hearts.append(h)}
function burst(){for(let i=0;i<48;i++){let c=document.createElement('span');c.className='confetti';c.textContent=['♥','♡','✦','✨'][i%4];c.style.left='50%';c.style.top='48%';c.style.color=['#ff91ba','#ffe1b8','#fff'][i%3];c.style.fontSize=12+Math.random()*20+'px';c.style.setProperty('--x',(Math.random()-.5)*innerWidth*.9+'px');c.style.setProperty('--y',(Math.random()-.5)*innerHeight*.9+'px');document.body.append(c);setTimeout(()=>c.remove(),1800)}}
function openGift(){$('intro').classList.add('hidden');$('reveal').classList.remove('hidden');burst()}$('openBtn').onclick=openGift;$('gift').onclick=openGift;$('gift').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openGift()}};$('againBtn').onclick=()=>{$('reveal').classList.add('hidden');$('intro').classList.remove('hidden')};$('settingsBtn').onclick=()=>$('editor').showModal();$('cancelBtn').onclick=()=>$('editor').close();$('saveBtn').onclick=()=>{data={to:$('to').value.trim()||defaults.to,from:$('from').value.trim()||defaults.from,note:$('note').value.trim()||defaults.note};render();$('editor').close()};function shareUrl(){const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');const url=new URL(location.href);url.search='';url.searchParams.set('gift',encoded);return url.toString()}$('shareBtn').onclick=async()=>{const url=shareUrl();try{await navigator.clipboard.writeText(url);$('shareBtn').textContent='✓ Đã sao chép';setTimeout(()=>$('shareBtn').textContent='♡ Sao chép link',2000)}catch(e){prompt('Sao chép đường link này:',url)}};
</script></body></html>
